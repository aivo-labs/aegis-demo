<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Fond dégradé vert émeraude -->
    <linearGradient id="favShieldBg" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#032e27" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#021c16" stop-opacity="1" />
    </linearGradient>

    <!-- Liseré extérieur vert menthe -->
    <linearGradient id="favMintRim" x1="10" y1="4" x2="54" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Dégradé Check Mark -->
    <linearGradient id="favCheckGrad" x1="20" y1="20" x2="44" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="40%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- 1. Contour du Bouclier (Liseré Vert Menthe & Fond Émeraude) -->
  <path
    d="M32 4L10 13.5V29.5C10 44.2 19.4 55.6 32 60C44.6 55.6 54 44.2 54 29.5V13.5L32 4Z"
    fill="url(#favShieldBg)"
    stroke="url(#favMintRim)"
    stroke-width="2.6"
    stroke-linejoin="round"
  />

  <!-- 2. Second Liseré Intérieur Vert Menthe -->
  <path
    d="M32 7.8L13.5 15.8V29.2C13.5 41.8 21.3 51.7 32 55.8C42.7 51.7 50.5 41.8 50.5 29.2V15.8L32 7.8Z"
    stroke="#6ee7b7"
    stroke-opacity="0.45"
    stroke-width="1.1"
  />

  <!-- 3. Maillage Géométrique : Facettes 3D Translucides Vert Émeraude -->
  <polygon points="32,7.8 13.5,15.8 32,22.5" fill="#10b981" fill-opacity="0.12" />
  <polygon points="32,7.8 50.5,15.8 32,22.5" fill="#059669" fill-opacity="0.18" />
  
  <polygon points="13.5,15.8 13.5,29.2 32,22.5" fill="#047857" fill-opacity="0.15" />
  <polygon points="50.5,15.8 50.5,29.2 32,22.5" fill="#10b981" fill-opacity="0.10" />

  <polygon points="13.5,29.2 18,43.5 32,46.5" fill="#10b981" fill-opacity="0.12" />
  <polygon points="50.5,29.2 46,43.5 32,46.5" fill="#047857" fill-opacity="0.18" />

  <polygon points="18,43.5 32,55.8 32,46.5" fill="#059669" fill-opacity="0.22" />
  <polygon points="46,43.5 32,55.8 32,46.5" fill="#10b981" fill-opacity="0.14" />

  <!-- 4. Arêtes du Maillage Cyber (Liserés Vert Menthe / Émeraude) -->
  <g stroke="#34d399" stroke-opacity="0.4" stroke-width="1.1">
    <line x1="32" y1="7.8" x2="32" y2="22.5" />
    <line x1="13.5" y1="15.8" x2="32" y2="22.5" />
    <line x1="50.5" y1="15.8" x2="32" y2="22.5" />
    <line x1="18" y1="43.5" x2="32" y2="55.8" />
    <line x1="46" y1="43.5" x2="32" y2="55.8" />
  </g>

  <!-- 5. Nœuds du Maillage -->
  <g fill="#6ee7b7">
    <circle cx="32" cy="7.8" r="1.4" />
    <circle cx="13.5" cy="15.8" r="1.3" />
    <circle cx="50.5" cy="15.8" r="1.3" />
    <circle cx="32" cy="22.5" r="1.4" />
    <circle cx="18" cy="43.5" r="1.3" />
    <circle cx="46" cy="43.5" r="1.3" />
    <circle cx="32" cy="55.8" r="1.5" />
  </g>

  <!-- 6. Symbole Check Mark Central (Optimisé Haute Lisibilité Favicon) -->
  <path
    d="M21.5 32.5L28.8 39.5L43 23.5"
    stroke="url(#favCheckGrad)"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M21.5 32.5L28.8 39.5L43 23.5"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
