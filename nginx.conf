server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Conserver le port et le host d'origine du client (ex: http://localhost:4321/)
    # Empêche Nginx de générer des redirections absolues avec son port interne 80
    absolute_redirect off;
    port_in_redirect off;

    # Compression Gzip (Hardening & Sobriété Numérique RGESN)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # En-têtes de sécurité de base (Préparation Pentest ANSSI / NIS 2)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Reverse-proxy vers le Token Handler Pure BFF (gate-proxy:8000)
    location /api/auth/ {
        proxy_pass http://gate-proxy:8000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Reverse-proxy vers l'API Backend Go (Zero-CORS interne Docker)
    location /api/ {
        proxy_pass http://backend:80/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }

    # Reverse-proxy dynamique vers la Documentation Starlight (Service docs interne Docker)
    # Utilise le DNS interne Docker 127.0.0.11 pour ne pas crasher si le conteneur docs n'est pas démarré
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $docs_upstream http://docs:80;

    location /docs {
        proxy_pass $docs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 502 503 504 = @docs_unavailable;
    }

    location @docs_unavailable {
        default_type text/html;
        return 503 '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Documentation Non Démarrée • Aegis</title><style>body{font-family:sans-serif;background:#090e1a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;}div{text-align:center;padding:2.5rem;background:#0f172a;border:1px solid #1e293b;border-radius:1rem;max-width:540px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);}h1{color:#34d399;font-size:1.5rem;margin-bottom:0.75rem;}p{font-size:0.9rem;line-height:1.5;color:#94a3b8;}pre{background:#020617;color:#38bdf8;padding:1rem;border-radius:0.5rem;font-size:0.875rem;margin:1.25rem 0;border:1px solid #334155;}a{color:#34d399;text-decoration:none;font-weight:bold;}a:hover{text-decoration:underline;}</style></head><body><div><h1>📖 Documentation Non Démarrée</h1><p>Le conteneur de documentation est un service optionnel (profil <code>docs</code>) afin de préserver les ressources du serveur.<br>Pour lancer la documentation en local :</p><pre>docker compose --profile docs up -d</pre><p><a href="/">← Retour à l\'accueil Aegis</a></p></div></body></html>';
    }

    # Cache immuable pour les assets statiques avec hash Vite/Astro
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Autorisation du dossier standard RFC /.well-known/ (security.txt)
    location ^~ /.well-known/ {
        allow all;
    }

    # Redirection automatique vers /demo si visite sur le sous-domaine demo.*
    if ($http_host ~* "^demo\.") {
        rewrite ^/$ /demo permanent;
    }

    # Routage Astro Static / SPA
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
    }

    # Interdiction furtive des fichiers cachés
    location ~ /\. {
        return 404;
        access_log off;
        log_not_found off;
    }
}
